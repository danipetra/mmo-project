services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmo
      POSTGRES_PASSWORD: mmo
      POSTGRES_DB: mmo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmo"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://mmo:mmo@postgres:5432/mmo
      JWT_SECRET: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  game-client:
    build:
      context: .
      dockerfile: apps/game-client/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - server

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - server

volumes:
  postgres-data:
